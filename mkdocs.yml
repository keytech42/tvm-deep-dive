site_name: TVM System Engineering Journey
site_description: Deep Learning Compiler Build Blueprint and Learning Notes
site_author: key-tech

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink

nav:
  - Home: index.md
  - Journal:
    - "01. Environment & Clone": journal/01_environment_and_clone.md
    - "02. Build & Compile": journal/02_build_and_compile.md
    - "03. Relax Compilation Pipeline": journal/03_relax_compilation_pipeline.md
  - Notes:
    - "System Architecture": notes/architecture.md

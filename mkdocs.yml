site_name: TVM System Engineering Journey
site_description: Deep Learning Compiler Build Blueprint and Learning Notes
site_author: key-tech
site_url: https://keytech42.github.io/tvm-deep-dive/
repo_url: https://github.com/keytech42/tvm-deep-dive
repo_name: tvm-deep-dive

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - roamlinks

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink

nav:
  - Home: index.md
  - Journal:
    - "01. Environment Setup & Clone": journal/01_environment_setup.md
    - "02. Build & Compile": journal/02_build_and_compile.md
    - "03. Relax Compilation Pipeline": journal/03_relax_compilation_pipeline.md
    - "04. Python Frontend Code Tracing": journal/04_frontend_code_tracing.md
    - "05. FFI Boundary Tracking": journal/05_ffi_boundary_tracking.md
    - "06. Operator Fusion Execution": journal/06_operator_fusion_execution.md
    - "__diff_test__": journal/diff_test.md
  - Notes:
    - "00. System Architecture": notes/00_system_architecture.md
    - "01. Compiler Design Philosophy": notes/01_compiler_design_philosophy.md
    - "02. Frontend Parsing and AST": notes/02_frontend_parsing_and_ast.md
    - "03. Serialization vs. Zero-Copy (FFI)": notes/03_ffi_and_packedfunc.md
    - "04. Operator Fusion Architecture": notes/04_operator_fusion_architecture.md
    - "05. Architecture Clarifications (Step 3 & 4A)": notes/05_architecture_clarifications.md
  - Glossary: glossary/glossary.md

extra_css:
  - stylesheets/custom.css
  - https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css
  - stylesheets/diff-theme.css

extra_javascript:
  - javascripts/custom-tooltip.js
  - https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js
  - javascripts/render-diff.js
